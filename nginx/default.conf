# Étape 1 (HTTP) : sert le site + proxy /api + expose le challenge ACME (certbot).
# Après avoir obtenu le certificat, remplace ce fichier par nginx/ssl.conf
# (adapte le domaine) puis redémarre nginx.

server {
    listen 80;
    server_name _;

    client_max_body_size 20m;

    # Force l'UTF-8 sur les fichiers statiques (HTML/JS/CSS) : sans ça certains
    # navigateurs retombent en latin-1 et cassent les accents (é, ê…).
    charset utf-8;
    charset_types text/html text/css application/javascript application/json image/svg+xml;

    # Challenge Let's Encrypt (webroot)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    root /usr/share/nginx/html;
    index login.html;

    location /api/ {
        proxy_pass http://backend:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 180s;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
