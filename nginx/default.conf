# Étape 1 (HTTP) : sert le site + proxy /api + expose le challenge ACME (certbot).
# Après avoir obtenu le certificat, remplace ce fichier par nginx/ssl.conf
# (adapte le domaine) puis redémarre nginx.

server {
    listen 80;
    server_name _;

    client_max_body_size 20m;

    # Force l'UTF-8 sur les fichiers statiques (HTML/JS/CSS) : sans ça certains
    # navigateurs retombent en latin-1 et cassent les accents (é, ê…).
    charset utf-8;
    charset_types text/html text/css application/javascript application/json image/svg+xml;

    # Challenge Let's Encrypt (webroot)
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    root /usr/share/nginx/html;
    index index.html;

    # En-têtes de sécurité (CSP…) + fichiers d'outillage interdits + cache.
    include /etc/nginx/snippets/adcraft-security.conf;
    # Pages 404 / 50x du front + @api_error (JSON quand le backend est à l'arrêt).
    include /etc/nginx/snippets/adcraft-error-pages.conf;

    location /api/ {
        proxy_pass http://backend:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 180s;
        # Le backend pose lui-même ses en-têtes (helmet) ; on ne cache jamais l'API.
        proxy_hide_header X-Powered-By;
        add_header Cache-Control "no-store" always;
        # L'API répond toujours en JSON : ses propres erreurs passent telles
        # quelles, et un backend muet (502/504 générés par nginx) donne @api_error
        # au lieu de la page HTML 50x. Détail : snippets/adcraft-error-pages.conf.
        proxy_intercept_errors off;
        error_page 500 502 503 504 = @api_error;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
