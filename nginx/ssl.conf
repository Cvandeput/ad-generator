# Étape 2 (HTTPS) : à utiliser APRÈS avoir obtenu le certificat.
# 1. Remplace TON-DOMAINE.TLD (2 endroits) par ton domaine réel.
# 2. cp nginx/ssl.conf nginx/default.conf  (sur le VPS)
# 3. docker compose restart nginx

server {
    listen 80;
    server_name TON-DOMAINE.TLD;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name TON-DOMAINE.TLD;

    client_max_body_size 20m;

    # Force l'UTF-8 sur les fichiers statiques (voir note dans default.conf).
    charset utf-8;
    charset_types text/html text/css application/javascript application/json image/svg+xml;

    ssl_certificate     /etc/letsencrypt/live/TON-DOMAINE.TLD/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/TON-DOMAINE.TLD/privkey.pem;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    root /usr/share/nginx/html;
    index login.html;

    location /api/ {
        proxy_pass http://backend:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 180s;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
