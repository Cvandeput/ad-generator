# Pages d'erreur AdCraft — à INCLURE dans un vhost existant.
#
#   include snippets/adcraft-error-pages.conf;      # dans le bloc server {}
#
# Ce fichier est volontairement séparé de adcraft-security.conf et du vhost
# complet : sur le VPS, le vhost de production vit dans
# /etc/nginx/sites-available/ads.devwork.cloud et a divergé de ce dépôt. Un
# `include` d'une seule ligne s'ajoute sans risque à l'existant, alors qu'une
# manipulation du vhost a déjà coupé les trois sites du serveur une fois
# (incident du 13/09).
#
# ⚠ Le bloc `location /api/` ci-dessous n'est PAS dans ce fichier : il doit
#    vivre dans le vhost, à côté du proxy_pass existant. Les deux directives à
#    y ajouter sont rappelées en commentaire à la fin.

error_page 404 /404.html;
error_page 500 502 503 504 /50x.html;

# Les pages d'erreur sont des fichiers du front comme les autres : servies
# telles quelles, sans cache (leur contenu change avec chaque déploiement et
# elles ne pèsent rien).
# `include` des en-têtes dans CHAQUE bloc : poser un add_header ici efface
# sinon toute la sécurité héritée du serveur (voir adcraft-headers.conf).
# Vérifié : sans cette ligne, la page 404 sortait sans CSP ni HSTS.
# `internal` : accessibles seulement via error_page. Sans lui, un GET direct
# sur /404.html répondrait 200 (« soft 404 » pour les moteurs) ; avec lui, il
# répond 404 en servant… la même page.
location = /404.html {
    internal;
    include snippets/adcraft-headers.conf;
    add_header Cache-Control "no-cache" always;
}
location = /50x.html {
    internal;
    include snippets/adcraft-headers.conf;
    add_header Cache-Control "no-cache" always;
}

# --- Réponse JSON quand le backend ne répond plus ----------------------------
# À référencer depuis `location /api/` (voir plus bas). Sans cela, un backend
# arrêté fait remonter la page HTML 50x à un client d'API, qui casse sur un
# `JSON.parse` au lieu d'afficher un message.
location @api_error {
    include snippets/adcraft-headers.conf;
    default_type application/json;
    add_header Cache-Control "no-store" always;
    # Texte sans accent : `return` écrit les octets bruts, et le front localise
    # de toute façon le message à partir du code.
    return 503 '{"error":"Service indisponible","code":"BACKEND_DOWN"}';
}

# ============================================================================
# À AJOUTER À LA MAIN dans le `location /api/` du vhost, juste après proxy_pass :
#
#     # N'incluez PAS adcraft-headers.conf ici : Node pose deja CSP, HSTS,
#     # nosniff et Cache-Control (helmet, server.js). Les deux produiraient
#     # deux en-tetes CSP, appliques en intersection par le navigateur.
#
#     # Le backend renvoie déjà du JSON sur ses 404 (middleware/errors.js).
#     # `off` est la valeur par défaut de nginx, mais elle est écrite ICI
#     # explicitement : la poser à `on` — réflexe courant quand on veut des
#     # pages d'erreur personnalisées — ferait servir /404.html en HTML à un
#     # client d'API. C'est LE piège de ce chantier.
#     proxy_intercept_errors off;
#
#     # En revanche, un 502/504 est généré par nginx lui-même (le backend ne
#     # répond pas du tout) : celui-là serait bien intercepté par error_page.
#     # On le renvoie donc en JSON, pas en HTML.
#     error_page 500 502 503 504 = @api_error;
# ============================================================================
