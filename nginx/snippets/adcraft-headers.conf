# En-têtes de sécurité AdCraft — UNIQUEMENT des add_header, aucun location.
#
#   include snippets/adcraft-headers.conf;
#
# POURQUOI CE FICHIER EXISTE, et c'est le piège nginx le plus coûteux du lot :
# `add_header` ne s'AJOUTE pas aux en-têtes du bloc parent, il les REMPLACE.
# Dès qu'un `location` pose un seul add_header — ne serait-ce qu'un
# Cache-Control — il perd TOUS les en-têtes de sécurité du bloc `server`. La CSP,
# le HSTS et le X-Frame-Options disparaissent silencieusement de ces réponses,
# sans aucune erreur au démarrage ni dans les journaux. Mesuré : la page 404 et
# /api/ sortaient toutes les deux nues.
#
# D'où la règle : TOUT location qui pose un add_header doit d'abord inclure ce
# fichier.
#
# `always` : sans ce mot-clé, l'en-tête n'est posé que sur les 2xx/3xx — les
# pages d'erreur 404 et 50x en seraient donc dépourvues, exactement l'inverse de
# ce qu'on veut.
#
# Les valeurs ci-dessous sont RECOPIÉES de snippets/adcraft-security.conf et
# doivent le rester à l'identique : ce fichier ne redéfinit pas la politique, il
# la réapplique là où nginx l'aurait effacée. Si l'une change, l'autre change.
# La même politique vit aussi côté backend dans helmet (server.js), qui couvre
# les réponses de l'application ; ici on couvre les fichiers statiques que nginx
# sert sans jamais passer par Node.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' https://fonts.googleapis.com; style-src-attr 'unsafe-inline'; font-src 'self' https://fonts.gstatic.com; img-src 'self' blob: data:; connect-src 'self'; frame-ancestors 'none'; form-action 'self'; base-uri 'self'; object-src 'none'; upgrade-insecure-requests" always;
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
add_header X-Frame-Options "DENY" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
