# En-têtes de sécurité + fichiers interdits. À inclure dans CHAQUE bloc server
# qui sert le front (repo : default.conf / ssl.conf ; VPS : le vhost de l'hôte
# /etc/nginx/sites-available/ads.devwork.cloud → copier ce fichier dans
# /etc/nginx/snippets/ et ajouter `include snippets/adcraft-security.conf;`).
#
# La CSP doit être posée ICI : en prod nginx sert le HTML directement, le
# backend (helmet) ne couvre que /api/. Même politique des deux côtés.

add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' https://fonts.googleapis.com; style-src-attr 'unsafe-inline'; font-src 'self' https://fonts.gstatic.com; img-src 'self' blob: data:; connect-src 'self'; frame-ancestors 'none'; form-action 'self'; base-uri 'self'; object-src 'none'; upgrade-insecure-requests" always;
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
add_header X-Frame-Options "DENY" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;

# Outillage du dossier frontend : jamais servi (package.json exposé en prod
# avant ce correctif).
location ~ ^/(package(-lock)?\.json|tailwind\.config\.js|css/input\.css)$ { return 404; }
location ~ ^/(node_modules|_tmp_shots)(/|$) { return 404; }
location ~ /\.(?!well-known/) { return 404; }

# Cache long pour les assets versionnés par le contenu (images, icônes), court
# pour le CSS/JS (pas de hash dans les noms).
location ~* \.(webp|png|jpg|jpeg|ico|svg|woff2?)$ {
    add_header Cache-Control "public, max-age=2592000, immutable";
    add_header X-Content-Type-Options "nosniff" always;
    try_files $uri =404;
}
# Pas de hash dans les noms de fichiers : un cache ferme rend chaque
# deploiement invisible pendant sa duree. `no-cache` = le navigateur garde le
# fichier mais revalide par ETag a chaque chargement (304, quelques octets).
location ~* \.(css|js|webmanifest)$ {
    add_header Cache-Control "no-cache";
    add_header X-Content-Type-Options "nosniff" always;
    try_files $uri =404;
}
