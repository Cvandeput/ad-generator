<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- i18n : masque le document le temps de l'hydratation (cf. js/i18n-boot.js). -->
    <script src="/js/i18n-boot.js"></script>

    <title data-i18n="meta.notFound.title">Page introuvable</title>
    <meta name="description" data-i18n-attr="content:meta.notFound.description" content="Cette page n'existe pas ou a été déplacée." />
    <!-- noindex : une page d'erreur n'a rien à faire dans un index de moteur de
         recherche, et surtout pas en concurrence des vraies pages. -->
    <meta name="robots" content="noindex, follow" />
    <meta property="og:site_name" data-i18n-attr="content:meta.siteName" content="" />
    <meta property="og:locale" content="fr_BE" />
    <meta property="og:locale:alternate" content="en_US" />
    <meta property="og:locale:alternate" content="nl_BE" />
    <link rel="icon" href="/img/icons/favicon.ico" sizes="48x48" />
    <link rel="icon" type="image/png" sizes="32x32" href="/img/icons/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/img/icons/favicon-16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/img/icons/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="theme-color" content="#1d4ed8" />
    <!-- Polices auto-hébergées (/fonts) : aucune requête vers Google. -->
    <link rel="preload" href="/fonts/inter-latin.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/space-grotesk-latin.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/material-symbols-outlined.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="stylesheet" href="/css/app.css" />
  </head>
  <body class="bg-background text-on-surface font-body-base antialiased flex flex-col min-h-screen">
    <header id="site-header" data-page="404" class="bg-surface-container-lowest border-b border-outline-variant sticky top-0 z-50"></header>

    <main class="flex-grow w-full max-w-container-max mx-auto px-lg py-xl flex items-center justify-center">
      <div class="w-full max-w-[560px] flex flex-col items-center gap-lg text-center">
        <span class="material-symbols-outlined text-[44px] text-outline" aria-hidden="true">search_off</span>

        <div class="flex flex-col gap-sm">
          <!-- Le code est dans un <p> et pas dans le <h1> : le titre de la page
               est la phrase utile, pas un nombre. Un lecteur d'écran annonce
               ainsi « Cette page n'existe pas » avant « erreur 404 ». -->
          <p class="font-label-md text-label-md text-outline tracking-[0.08em] uppercase" data-i18n="notFound.code">Erreur 404</p>
          <h1 class="font-display-lg text-display-lg text-on-surface" data-i18n="notFound.title">Cette page n'existe pas</h1>
          <p class="font-body-base text-body-base text-secondary" data-i18n="notFound.text">Le lien est peut-être périmé, ou l'adresse comporte une faute de frappe. Voici par où repartir.</p>
        </div>

        <!-- Sorties utiles. Le studio et les tarifs sont ajoutés par js/404.js
             selon l'état du compte : proposer « Ouvrir le studio » à un visiteur
             anonyme l'envoie sur un écran de connexion, ce qui est une deuxième
             impasse après la première. -->
        <nav id="exits" class="flex flex-col sm:flex-row flex-wrap gap-sm justify-center w-full" aria-label="" data-i18n-attr="aria-label:notFound.exitsAria">
          <a href="/" class="min-h-[44px] lg:min-h-0 lg:h-9 px-lg py-xs rounded bg-primary-container text-on-primary inline-flex items-center justify-center gap-xs font-label-md text-label-md hover:bg-primary transition-colors" data-i18n="notFound.home">Retour à l'accueil</a>
        </nav>

        <p class="font-body-sm text-body-sm text-secondary" data-i18n-html="notFound.help_html">Vous cherchiez quelque chose de précis ? <a href="/legal.html#contact" class="text-primary-container underline">Écrivez-nous</a>.</p>
      </div>
    </main>

    <footer id="site-footer" class="bg-surface"></footer>
    <script type="module" src="/js/404.js"></script>
  </body>
</html>
