<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Inscription — AdCraft</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet" />
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=block"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/css/app.css" />
    <style>
      .carousel-slide {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
        opacity: 0;
        animation: fadeSlide 20s infinite;
      }
      .carousel-slide:nth-child(1) { animation-delay: 0s; }
      .carousel-slide:nth-child(2) { animation-delay: 5s; }
      .carousel-slide:nth-child(3) { animation-delay: 10s; }
      .carousel-slide:nth-child(4) { animation-delay: 15s; }
      @keyframes fadeSlide {
        0%, 20% { opacity: 1; z-index: 10; }
        25%, 100% { opacity: 0; z-index: 0; }
      }
    </style>
  </head>
  <body class="w-full h-screen overflow-hidden flex flex-col lg:flex-row bg-background">
    <!-- Colonne gauche : carrousel avant / après -->
    <div class="hidden lg:block relative w-full lg:w-1/2 h-full bg-gradient-to-br from-surface-container-high to-surface-container overflow-hidden">
      <img alt="Photo brute" class="carousel-slide" src="/img/input-redbull.jpg" onerror="this.remove()" />
      <img alt="Visuel généré" class="carousel-slide" src="/img/output-redbull.jpg" onerror="this.remove()" />
      <img alt="Photo brute" class="carousel-slide" src="/img/input-pringles.jpg" onerror="this.remove()" />
      <img alt="Visuel généré" class="carousel-slide" src="/img/output-pringles.jpg" onerror="this.remove()" />
      <div class="absolute bottom-8 left-8 z-20 bg-surface-container-lowest/80 backdrop-blur-md px-md py-sm rounded-full border border-outline-variant flex items-center gap-sm">
        <span class="material-symbols-outlined text-on-surface text-[18px]">compare</span>
        <span class="font-label-md text-label-md text-on-surface">Avant / Après</span>
      </div>
    </div>

    <!-- Colonne droite : inscription -->
    <div class="w-full lg:w-1/2 h-full flex items-center justify-center relative p-md">
      <main class="relative z-10 w-full max-w-[360px]">
        <div class="bg-surface-container-lowest border border-outline-variant rounded-xl p-lg flex flex-col gap-lg">
          <div class="text-center">
            <h1 class="font-display-lg text-display-lg text-on-surface">Créer un compte</h1>
            <p class="font-body-sm text-body-sm text-secondary mt-xs">Rejoignez AdCraft en quelques secondes.</p>
          </div>

          <form id="auth-form" class="flex flex-col gap-md">
            <div class="flex flex-col gap-xs">
              <label class="font-label-sm text-label-sm text-secondary" for="email">Email</label>
              <input
                id="email" name="email" type="email" required autocomplete="username" placeholder="nom@exemple.com"
                class="w-full h-[40px] px-sm bg-surface-container-lowest border border-outline-variant rounded-lg font-body-sm text-body-sm text-on-surface placeholder:text-outline focus:outline-none focus:border-primary-container focus:ring-1 focus:ring-primary-container transition-colors"
              />
            </div>
            <div class="flex flex-col gap-xs">
              <label class="font-label-sm text-label-sm text-secondary" for="password">Mot de passe</label>
              <input
                id="password" name="password" type="password" required autocomplete="new-password" minlength="8" placeholder="8 caractères minimum"
                class="w-full h-[40px] px-sm bg-surface-container-lowest border border-outline-variant rounded-lg font-body-sm text-body-sm text-on-surface placeholder:text-outline focus:outline-none focus:border-primary-container focus:ring-1 focus:ring-primary-container transition-colors"
              />
            </div>
            <div class="flex flex-col gap-xs">
              <label class="font-label-sm text-label-sm text-secondary" for="password2">Confirmer le mot de passe</label>
              <input
                id="password2" name="password2" type="password" required autocomplete="new-password" placeholder="••••••••"
                class="w-full h-[40px] px-sm bg-surface-container-lowest border border-outline-variant rounded-lg font-body-sm text-body-sm text-on-surface placeholder:text-outline focus:outline-none focus:border-primary-container focus:ring-1 focus:ring-primary-container transition-colors"
              />
            </div>

            <p id="error" class="font-body-sm text-body-sm text-error hidden"></p>

            <div class="pt-sm">
              <button
                id="submit-btn" type="submit"
                class="w-full h-[40px] bg-primary-container text-on-primary rounded-lg font-label-md text-label-md flex items-center justify-center hover:bg-primary transition-colors disabled:opacity-60"
              >
                Créer mon compte
              </button>
            </div>
          </form>

          <div class="text-center pt-xs">
            <a href="/login.html" class="font-body-sm text-body-sm text-secondary hover:text-primary-container transition-colors inline-block">
              Déjà un compte ? Se connecter
            </a>
          </div>
        </div>
      </main>
    </div>

    <script type="module" src="/js/register.js"></script>
  </body>
</html>
