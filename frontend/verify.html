<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- i18n : masque le document le temps de l'hydratation (cf. js/i18n-boot.js). -->
    <script src="/js/i18n-boot.js"></script>

    <title data-i18n="meta.verify.title">Confirmation de votre adresse</title>
    <meta name="robots" content="noindex, nofollow" />
    <link rel="icon" href="/img/icons/favicon.ico" sizes="48x48" />
    <link rel="icon" type="image/png" sizes="32x32" href="/img/icons/favicon-32.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/img/icons/apple-touch-icon.png" />
    <meta name="theme-color" content="#1d4ed8" />
    <!-- Polices auto-hébergées (/fonts) : aucune requête vers Google. -->
    <link rel="preload" href="/fonts/inter-latin.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/space-grotesk-latin.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/material-symbols-outlined.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="stylesheet" href="/css/app.css" />
  </head>
  <body class="bg-background text-on-surface font-body-base w-full min-h-screen flex flex-col">
    <div class="h-[60px] flex-shrink-0 flex items-center justify-between gap-md px-lg">
      <a href="/" class="flex items-center gap-sm min-h-[44px]" aria-label="" data-i18n-attr="aria-label:nav.homeAria">
        <img src="/img/logo-adcraft.webp" alt="" data-i18n-attr="alt:nav.logoAlt" width="105" height="24" class="h-6 w-auto" />
      </a>
      <div id="lang-slot" class="flex items-center"></div>
    </div>

    <main class="flex-1 flex items-center justify-center px-lg pb-xl">
      <div id="panel" class="w-full max-w-[420px] bg-surface-container-lowest border border-outline-variant rounded-xl p-lg flex flex-col items-center gap-md text-center">
        <span class="material-symbols-outlined text-[36px] text-outline" aria-hidden="true">hourglass_top</span>
        <h1 class="font-headline-md text-headline-md text-on-surface" data-i18n="verify.pending">Confirmation en cours…</h1>
      </div>
    </main>

    <footer class="px-lg py-md flex flex-wrap justify-center gap-md">
      <span class="font-label-sm text-label-sm text-outline" data-i18n="footer.copyrightFixed">© 2026</span>
      <a href="/legal.html#mentions" class="font-label-sm text-label-sm text-secondary hover:text-on-surface inline-flex items-center justify-center min-h-[44px] min-w-[44px] lg:min-h-0 lg:min-w-0" data-i18n="footer.legalNotice">Mentions légales</a>
      <a href="/legal.html#confidentialite" class="font-label-sm text-label-sm text-secondary hover:text-on-surface inline-flex items-center justify-center min-h-[44px] min-w-[44px] lg:min-h-0 lg:min-w-0" data-i18n="footer.privacy">Confidentialité</a>
    </footer>

    <script type="module" src="/js/verify.js"></script>
  </body>
</html>
