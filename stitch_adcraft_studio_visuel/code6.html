<style>
        /* Minimalist tweaks */
        body {
            background-color: #FAFAF9; /* Forcing the requested flat background */
        }
        
        .input-minimal {
            border-color: #E7E5E4;
        }
        
        .input-minimal:focus {
            border-color: #1D4ED8;
            box-shadow: none; /* Removing glow */
            outline: none;
        }
    </style>

<body class="min-h-screen flex items-center justify-center font-body-base text-on-surface antialiased p-md md:p-lg">
<!-- Main Container -->
<main class="w-full max-w-[440px] flex flex-col items-center">
<!-- Brand / Header -->
<div class="mb-lg flex flex-col items-center text-center">
<!-- Replacing logo with simple text as per minimalist/high-end tool aesthetic -->
<h1 class="font-display-lg text-display-lg md:font-display-lg md:text-display-lg tracking-tight mb-xs">AdCraft</h1>
<p class="font-body-base text-body-base text-secondary">Création visuelle intelligente.</p>
</div>
<!-- Central Card -->
<div class="bg-surface-container-lowest border border-[#E7E5E4] rounded-lg w-full p-lg md:p-xl">
<h2 class="font-headline-md text-headline-md mb-lg text-center">Créer un compte</h2>
<form action="#" class="flex flex-col gap-md" method="POST">
<!-- Nom Field -->
<div class="flex flex-col gap-xs">
<label class="font-label-md text-label-md text-on-surface" for="name">Nom complet</label>
<input class="input-minimal w-full bg-surface-container-lowest rounded-lg border px-md py-sm font-body-base text-body-base text-on-surface placeholder:text-[#78716C] transition-colors h-[40px]" id="name" name="name" placeholder="Votre nom" required="" type="text"/>
</div>
<!-- Email Field -->
<div class="flex flex-col gap-xs">
<label class="font-label-md text-label-md text-on-surface" for="email">Email professionnel</label>
<input class="input-minimal w-full bg-surface-container-lowest rounded-lg border px-md py-sm font-body-base text-body-base text-on-surface placeholder:text-[#78716C] transition-colors h-[40px]" id="email" name="email" placeholder="nom@entreprise.com" required="" type="email"/>
</div>
<!-- Password Field -->
<div class="flex flex-col gap-xs">
<label class="font-label-md text-label-md text-on-surface" for="password">Mot de passe</label>
<input class="input-minimal w-full bg-surface-container-lowest rounded-lg border px-md py-sm font-body-base text-body-base text-on-surface placeholder:text-[#78716C] transition-colors h-[40px]" id="password" name="password" placeholder="••••••••" required="" type="password"/>
</div>
<!-- Confirm Password Field -->
<div class="flex flex-col gap-xs mb-sm">
<label class="font-label-md text-label-md text-on-surface" for="confirm_password">Confirmation du mot de passe</label>
<input class="input-minimal w-full bg-surface-container-lowest rounded-lg border px-md py-sm font-body-base text-body-base text-on-surface placeholder:text-[#78716C] transition-colors h-[40px]" id="confirm_password" name="confirm_password" placeholder="••••••••" required="" type="password"/>
</div>
<!-- Submit Button -->
<button class="w-full bg-[#1D4ED8] hover:bg-[#1E40AF] text-on-primary font-label-md text-label-md rounded-lg py-[10px] transition-colors flex justify-center items-center mt-sm" type="submit">
                    Créer mon compte
                </button>
</form>
</div>
<!-- Footer Links -->
<div class="mt-lg text-center">
<a class="font-body-sm text-body-sm text-secondary hover:text-on-surface transition-colors" href="#">
                Déjà inscrit ? Se connecter
            </a>
</div>
</main>
</body></html>
