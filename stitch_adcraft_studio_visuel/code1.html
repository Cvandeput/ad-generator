<style>

        body {

        /* Animation for the before/after carousel */
        .carousel-slide {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            opacity: 0;
            animation: fadeSlide 24s infinite;
        }
        
        .carousel-slide:nth-child(1) { animation-delay: 0s; } /* Product 1 - Before */
        .carousel-slide:nth-child(2) { animation-delay: 4s; } /* Product 1 - After */
        .carousel-slide:nth-child(3) { animation-delay: 8s; } /* Product 2 - Before */
        .carousel-slide:nth-child(4) { animation-delay: 12s; } /* Product 2 - After */
        .carousel-slide:nth-child(5) { animation-delay: 16s; } /* Product 3 - Before */
        .carousel-slide:nth-child(6) { animation-delay: 20s; } /* Product 3 - After */

        @keyframes fadeSlide {
            0%, 15% { opacity: 1; z-index: 10; }
            17%, 100% { opacity: 0; z-index: 0; }
        }
    </style>
