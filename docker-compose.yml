services:
  backend:
    build: ./backend
    restart: unless-stopped
    env_file: .env
    environment:
      - NODE_ENV=production
      - DATA_DIR=/app/data
    volumes:
      - ./backend/data:/app/data
    expose:
      - "3000"
    # Permet au conteneur backend d'atteindre le n8n existant du VPS
    # (qu'il tourne en systemd sur l'hôte ou dans un autre conteneur exposant 5678).
    # Dans .env : N8N_WEBHOOK_URL=http://host.docker.internal:5678/webhook/generate-ads
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # NE DEMARRE PAS SUR LE VPS DE PROD : nginx y tourne sur l'hote (vhosts dans
  # /etc/nginx/sites-available/). Ce service entrerait en conflit sur 80/443 et
  # couperait le site. Le `profiles:` le neutralise : `docker compose up -d` ne
  # le demarre plus. Pour un environnement sans nginx hote :
  #   docker compose --profile with-nginx up -d
  nginx:
    profiles: ["with-nginx"]
    image: nginx:stable
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./frontend:/usr/share/nginx/html:ro
      - ./certbot/www:/var/www/certbot
      - ./certbot/conf:/etc/letsencrypt
    depends_on:
      - backend

# n8n n'est PAS géré ici : on réutilise l'instance existante du VPS.
